name: CI — OmniTrain Python Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    name: Python Unit Tests (Ubuntu)
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'setup.py', 'pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          pip install pytest pytest-cov pyyaml pyserial

      - name: Run unit tests
        run: |
          pytest tests/ -v --ignore=tests/parity \
            --cov=src/omnitrain \
            --cov-report=term-missing \
            --cov-report=xml \
            -x  # Stop on first failure

      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml

  cpp-syntax-check:
    name: C++ Syntax Check (GCC)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get install -y g++

      - name: Verify OmniEngine core compiles
        run: |
          g++ -std=c++17 -c src/cpp_engine/core/src/OmniEngine.cpp \
              -I src/cpp_engine/core/include \
              -DOMNI_MAX_DIM=256 \
              -o /tmp/OmniEngine.o
          echo "✅ OmniEngine.cpp compiled successfully"

      - name: Verify Linux HALs (raspi / jetson) compile
        run: |
          g++ -std=c++17 -x c++ src/cpp_engine/hal/raspi/OmniHAL.hpp \
              -I src/cpp_engine/core/include -fsyntax-only
          g++ -std=c++17 -x c++ src/cpp_engine/hal/jetson/OmniHAL.hpp \
              -I src/cpp_engine/core/include -fsyntax-only
          g++ -std=c++17 -x c++ src/cpp_engine/core/include/OmniEngineNEON.hpp \
              -I src/cpp_engine/core/include -fsyntax-only
          echo "✅ All Linux HAL headers compile cleanly"

  parity-check:
    name: Python ↔ C++ Numerical Parity
    runs-on: ubuntu-22.04
    needs: [python-tests, cpp-syntax-check]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Install GCC
        run: sudo apt-get install -y g++

      - name: Generate reference outputs (Python)
        run: python tests/parity/generate_reference.py

      - name: Compile C++ parity checker
        run: |
          g++ -std=c++17 -O2 tests/parity/test_parity_check.cpp \
              src/cpp_engine/core/src/OmniEngine.cpp \
              -I src/cpp_engine/core/include \
              -DOMNI_MAX_DIM=64 \
              -o /tmp/parity_check

      - name: Run parity check (Python ↔ C++ tolerance < 1e-4)
        run: |
          /tmp/parity_check \
            tests/parity/parity_brain.omnibit \
            tests/parity/reference_outputs.json
